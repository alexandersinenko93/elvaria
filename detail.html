<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elvaria · Tutorial &amp; Detail</title>
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/cards.css">
<link rel="stylesheet" href="src/css/guides.css">
<link rel="stylesheet" href="src/css/sources_drawer.css">
<link rel="stylesheet" href="src/css/sources_modal.css">
</head>
<body>
<a href="#mainInhalt" class="sr" id="skip">Zum Hauptinhalt springen</a>
<header>
  <div class="hwrap">
    <a href="index.html" class="brand"><b>ELVARIA</b><span>Businessplan · Yoga als Event</span></a>
    <nav class="hnav" id="hnav">
      <a href="index.html">Start</a>
      <a href="assistent.html">Assistent</a>
      <a href="businessplan.html">Businessplan</a>
      <a href="anhang.html">Anhang</a>
      <button type="button" class="btn-sources-nav" onclick="ELVARIA_SOURCES.openExplorer()">Quellen &amp; Recht</button>
    </nav>
    <div class="hsearch">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="qG" type="search" placeholder="Alles durchsuchen …" autocomplete="off" aria-label="Alles durchsuchen">
      <kbd>/</kbd>
      <div id="gPanel" hidden><div id="gList"></div></div>
    </div>
    <div class="hprog"><span class="dot"></span><span id="hprogTxt">0 Schritte</span></div>
  </div>
</header>

<main id="mainInhalt" class="page-wrap" tabindex="-1">
  <div class="dbar">
    <a href="anhang.html" class="chip"><span>←</span> Zurück zum Anhang</a>
    <div class="dnav"><button id="prev"><span id="prevT"></span> ←</button><button id="next">→ <span id="nextT"></span></button></div>
  </div>
  <div class="dhead">
    <div class="dkick" id="dKick"></div>
    <h1 id="dH"></h1>
    <p class="dsub" id="dP"></p>
    <div class="dtags" id="dTags"></div>
  </div>
  <div class="seg" id="dSeg">
    <button class="on" data-seg="quick">Kurzanleitung <span id="segQN"></span></button>
    <button data-seg="deep">Deep-Guide <span id="segDN"></span></button>
  </div>
  <div class="dbody">
    <div>
      <div id="paneQuick">
        <div class="dsteps">
          <div class="dstep-h"><b id="dTutHead">Schritt für Schritt</b><span id="dNum"></span></div>
          <div class="pbar" style="margin-bottom:18px"><i id="dBar" style="width:0%"></i></div>
          <div id="dSteps"></div>
        </div>
      </div>
      <div id="paneDeep" hidden><div id="dDeep"></div><div id="dCta2" style="margin-top:20px;display:flex;gap:10px"></div></div>
      <div class="rel-wrap" id="dRel"></div>
    </div>
    <aside class="dside">
      <div class="dside-sec" id="dFacts"></div>
      <div class="dside-sec" id="dNotes"></div>
      <div class="dside-sec" id="dCta"></div>
    </aside>
  </div>
</main>

<script src="src/data/fallback_sources.js"></script>
<script src="src/components/SourcesDrawer.js"></script>
<script src="src/js/data/platforms_1.js"></script>
<script src="src/js/data/platforms_2.js"></script>
<script src="src/js/data/ideas.js"></script>
<script src="src/js/data/deep_guides_1.js"></script>
<script src="src/js/data/deep_guides_2.js"></script>
<script src="src/js/core/store_utils.js"></script>
<script src="src/js/views/detail_deep_steps.js"></script>
<script src="src/js/views/detail_view.js"></script>
<script src="src/js/core/nav_search.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const kind = params.get('kind') || 'p';
    const id = params.get('id') || 'ev';
    openDetail(kind, id);
  });
</script>
</body>
</html>
